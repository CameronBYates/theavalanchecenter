name: IndexNow

# When the site changes (not the 3-hourly storm data, which pings on its own),
# refresh sitemap dates and tell Bing every page so it recrawls quickly.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: storm-watch
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Update sitemap dates
        run: |
          node seo/sitemap-lastmod.mjs
          if ! git diff --quiet -- sitemap.xml; then
            git config user.name "storm-watch[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "Update sitemap dates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Tell Bing (IndexNow)
        run: node seo/indexnow.mjs
